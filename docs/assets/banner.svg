<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Claude Code Harness</title>
  <desc id="banner-desc">Banner for Claude Code Harness: one command installs a complete, guarded .claude folder with 14 agents, 17 skills, a compliance gate, secret and PII guards, and a knowledge graph.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262421"/>
      <stop offset="1" stop-color="#171614"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d97757" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#d97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#f4efe6" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="dot-mask">
      <rect width="1280" height="360" fill="url(#fade)"/>
    </mask>
    <rect id="ray" x="-7" y="-92" width="14" height="60" rx="7"/>
    <clipPath id="frame">
      <rect width="1280" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#bg)"/>
    <rect width="1280" height="360" fill="url(#dots)" mask="url(#dot-mask)"/>

    <!-- the mark: a twelve-ray burst around the "dot" -->
    <circle cx="188" cy="168" r="170" fill="url(#glow)"/>
    <g transform="translate(188 168)" fill="#d97757">
      <use href="#ray"/>
      <use href="#ray" transform="rotate(30)" fill-opacity="0.82"/>
      <use href="#ray" transform="rotate(60)"/>
      <use href="#ray" transform="rotate(90)" fill-opacity="0.82"/>
      <use href="#ray" transform="rotate(120)"/>
      <use href="#ray" transform="rotate(150)" fill-opacity="0.82"/>
      <use href="#ray" transform="rotate(180)"/>
      <use href="#ray" transform="rotate(210)" fill-opacity="0.82"/>
      <use href="#ray" transform="rotate(240)"/>
      <use href="#ray" transform="rotate(270)" fill-opacity="0.82"/>
      <use href="#ray" transform="rotate(300)"/>
      <use href="#ray" transform="rotate(330)" fill-opacity="0.82"/>
      <circle r="15" fill="#f4efe6"/>
    </g>

    <!-- wordmark -->
    <text x="332" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="-2" fill="#f4efe6">Claude Code <tspan fill="#d97757">Harness</tspan></text>
    <text x="336" y="196" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#c9c2b6">One command. A complete, guarded <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#f4efe6">.claude/</tspan> for any project.</text>

    <!-- feature chips -->
    <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f4efe6">
      <g transform="translate(336 228)">
        <rect width="120" height="36" rx="18" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.18"/>
        <text x="60" y="24" text-anchor="middle">14 agents</text>
      </g>
      <g transform="translate(468 228)">
        <rect width="112" height="36" rx="18" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.18"/>
        <text x="56" y="24" text-anchor="middle">17 skills</text>
      </g>
      <g transform="translate(592 228)">
        <rect width="176" height="36" rx="18" fill="#d97757" fill-opacity="0.22" stroke="#d97757" stroke-opacity="0.7"/>
        <text x="88" y="24" text-anchor="middle">compliance gate</text>
      </g>
      <g transform="translate(780 228)">
        <rect width="208" height="36" rx="18" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.18"/>
        <text x="104" y="24" text-anchor="middle">secret + PII guards</text>
      </g>
      <g transform="translate(1000 228)">
        <rect width="184" height="36" rx="18" fill="#f4efe6" fill-opacity="0.08" stroke="#f4efe6" stroke-opacity="0.18"/>
        <text x="92" y="24" text-anchor="middle">knowledge graph</text>
      </g>
    </g>

    <!-- install line -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
      <text x="336" y="312" fill="#8f887c"><tspan fill="#d97757">$</tspan> python3 install.py DIR=<tspan fill="#c9c2b6">"/path/to/your/project"</tspan><tspan fill="#d97757"> █</tspan></text>
    </g>
  </g>
</svg>
