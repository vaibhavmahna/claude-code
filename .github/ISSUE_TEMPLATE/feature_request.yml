name: Feature request
description: Suggest a new capability or a change to existing behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, tokens, API keys or personal data (PII). Use placeholders such as `<API_KEY>`.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installer
        - Security hooks
        - Context budget and handoffs
        - Agents
        - Skills
        - Knowledge graph
        - Tools (doctor, doc_format, svg_lint, cleanup)
        - Docs
        - Evals
        - Other
    validations:
      required: true
